name: Finance checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build
        env:
          WRANGLER_SEND_METRICS: false
      - run: pnpm exec wrangler deploy --dry-run --env production -c apps/finance-worker/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: false
